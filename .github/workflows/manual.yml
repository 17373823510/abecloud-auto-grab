# 手动触发 workflow：仅 workflow_dispatch，用于测试和调试
name: Manual Test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: false
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - check-only
          - full
          - test-notify

permissions:
  contents: write
  actions: write

concurrency:
  group: grab-manual
  cancel-in-progress: false

jobs:
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 仅需要真实浏览器的模式才安装：
      # test-notify 只发通知、check-only 只做轻量 requests 探测，都不启动浏览器，
      # 跳过可省下首次约 40s 的 Chromium 下载。
      - name: Install Playwright Chromium
        if: inputs.mode == 'dry-run' || inputs.mode == 'full'
        run: |
          playwright install chromium
          # sudo 会重置 PATH 为系统 secure_path，找不到 hostedtoolcache 里的 playwright，
          # 必须用 env 显式把当前 PATH 传进去；runner 本身已预装大部分系统库，
          # 故 deps 失败只告警不阻断（真正缺库会在启动浏览器时精确报错）。
          sudo env "PATH=$PATH" "$(command -v playwright)" install-deps chromium \
            || echo "::warning::install-deps 未完成（runner 通常已预装依赖），继续执行"

      - name: Run (dry-run)
        if: inputs.mode == 'dry-run'
        env:
          ABECLOUD_USERNAME: ${{ secrets.ABECLOUD_USERNAME }}
          ABECLOUD_PASSWORD: ${{ secrets.ABECLOUD_PASSWORD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 渠道开关：必须与 grab.yml 保持一致，否则测试环境与定时抢购行为不一致
          PUSHPLUS_WECHAT_ENABLED: ${{ vars.PUSHPLUS_WECHAT_ENABLED }}
          PUSHPLUS_QQ_ENABLED: ${{ vars.PUSHPLUS_QQ_ENABLED }}
          PUSHPLUS_SMS_ENABLED: ${{ vars.PUSHPLUS_SMS_ENABLED }}
        run: python main.py --dry-run --verbose

      - name: Run (check-only)
        if: inputs.mode == 'check-only'
        env:
          ABECLOUD_USERNAME: ${{ secrets.ABECLOUD_USERNAME }}
          ABECLOUD_PASSWORD: ${{ secrets.ABECLOUD_PASSWORD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 渠道开关：必须与 grab.yml 保持一致，否则测试环境与定时抢购行为不一致
          PUSHPLUS_WECHAT_ENABLED: ${{ vars.PUSHPLUS_WECHAT_ENABLED }}
          PUSHPLUS_QQ_ENABLED: ${{ vars.PUSHPLUS_QQ_ENABLED }}
          PUSHPLUS_SMS_ENABLED: ${{ vars.PUSHPLUS_SMS_ENABLED }}
        run: python main.py --check-only --verbose

      - name: Run (full)
        if: inputs.mode == 'full'
        env:
          ABECLOUD_USERNAME: ${{ secrets.ABECLOUD_USERNAME }}
          ABECLOUD_PASSWORD: ${{ secrets.ABECLOUD_PASSWORD }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 渠道开关：必须与 grab.yml 保持一致，否则测试环境与定时抢购行为不一致
          PUSHPLUS_WECHAT_ENABLED: ${{ vars.PUSHPLUS_WECHAT_ENABLED }}
          PUSHPLUS_QQ_ENABLED: ${{ vars.PUSHPLUS_QQ_ENABLED }}
          PUSHPLUS_SMS_ENABLED: ${{ vars.PUSHPLUS_SMS_ENABLED }}
        run: python main.py --verbose

      - name: Run (test-notify)
        if: inputs.mode == 'test-notify'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 渠道开关：必须与 grab.yml 保持一致，否则测试环境与定时抢购行为不一致
          PUSHPLUS_WECHAT_ENABLED: ${{ vars.PUSHPLUS_WECHAT_ENABLED }}
          PUSHPLUS_QQ_ENABLED: ${{ vars.PUSHPLUS_QQ_ENABLED }}
          PUSHPLUS_SMS_ENABLED: ${{ vars.PUSHPLUS_SMS_ENABLED }}
        run: python main.py --test-notify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7
